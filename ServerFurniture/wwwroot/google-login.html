<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        #g_id_onload {
            margin: 20px 0;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Server Furniture</h1>
        <div id="g_id_onload"
             data-client_id="791676211225-ub2s3g6fu385nj3v013qcbhcv7of6naa.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
        <div class="loader" id="loader"></div>
        <div class="message" id="message"></div>
    </div>

    <script>
        const API_URL = 'https://localhost:7279'; // Change to your API URL

        function handleCredentialResponse(response) {
            const loader = document.getElementById('loader');
            const message = document.getElementById('message');

            loader.style.display = 'block';
            message.style.display = 'none';

            // Send ID token to your backend
            fetch(`${API_URL}/api/auth/google`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    idToken: response.credential
                })
            })
            .then(res => {
                loader.style.display = 'none';
                if (!res.ok) throw new Error('Login failed');
                return res.json();
            })
            .then(data => {
                // Store tokens
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('expiresAt', data.expiresAt);

                // Show success message
                message.textContent = 'Login successful! Redirecting...';
                message.className = 'message success';

                // Redirect after 1 second
                setTimeout(() => {
                    window.location.href = '/dashboard.html'; // Change to your dashboard URL
                }, 1000);
            })
            .catch(error => {
                loader.style.display = 'none';
                message.textContent = `Login error: ${error.message}`;
                message.className = 'message error';
                console.error('Error:', error);
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: '791676211225-ub2s3g6fu385nj3v013qcbhcv7of6naa.apps.googleusercontent.com', // Replace with your Google Client ID
                callback: handleCredentialResponse
            });
        };
    </script>
</body>
</html>
